{% extends "base.html" %}
{% block title %}题目列表{% endblock %}
{% block content %}
<section class="card">
<h1>题目列表</h1>
<p id="flash" class="flash" style="display:none"></p>
<div id="empty" class="empty" style="display:none">暂无题目</div>
<table id="problems-table" style="display:none">
<thead>
<tr><th>编号</th><th>标题</th><th>难度</th><th>标签</th><th>时间限制</th><th>内存限制</th></tr>
</thead>
<tbody id="problems-body"></tbody>
</table>
<p id="loading" class="muted">加载中...</p>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/problems.js"></script>
<script>
(async function() {
    const user = await requireLogin();
    if (!user) return;
    await loadProblems();
})();
</script>
{% endblock %}

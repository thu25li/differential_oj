{% extends "base.html" %}
{% block title %}首页{% endblock %}
{% block content %}
<section class="card">
<h1> differential OJ </h1>
<p>基于 FastAPI 的 Online Judge 系统。</p>
<p id="redirect-hint">正在检查登录状态...</p>
</section>
{% endblock %}
{% block scripts %}
<script>
(async function() {
    try {
        const r = await api('GET', '/api/auth/me');
        if (r && r.data) {
            window.location.href = '/problems';
        }
    } catch (e) {
        window.location.href = '/login';
    }
})();
</script>
{% endblock %}

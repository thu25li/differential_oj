{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="card narrow">
<h1>注册</h1>
<form id="register-form" onsubmit="event.preventDefault(); handleRegister();" class="form">
<div class="form-row">
<label for="username">用户名（3-32 字符）</label>
<input type="text" id="username" required minlength="3" maxlength="32">
</div>
<div class="form-row">
<label for="password">密码（至少 8 字符）</label>
<input type="password" id="password" required minlength="8">
</div>
<button type="submit" class="btn btn-primary">注册</button>
<p id="error-msg" class="error"></p>
<p id="success-msg" class="success"></p>
</form>
<p class="muted">已有账号？ <a href="/login">去登录</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
async function handleRegister() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    document.getElementById('error-msg').textContent = '';
    document.getElementById('success-msg').textContent = '';
    try {
        await doRegister(u, p);
        document.getElementById('success-msg').textContent = '注册成功，正在跳转到登录页...';
        setTimeout(() => { window.location.href = '/login'; }, 1000);
    } catch (e) {
        document.getElementById('error-msg').textContent = e.message;
    }
}
</script>
{% endblock %}

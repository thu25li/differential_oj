{% extends "base.html" %}
{% block title %}测试点日志{% endblock %}
{% block content %}
<section class="card">
<h1>测试点日志（教师/管理员）</h1>
<form id="filter-form" class="form" onsubmit="event.preventDefault(); loadLogs(1);">
<div class="form-row">
<label>题目编号</label>
<input type="text" id="filter-problem" placeholder="如 P1001">
</div>
<div class="form-row">
<label>结果</label>
<select id="filter-result">
<option value="">全部</option>
<option value="AC">AC</option>
<option value="WA">WA</option>
<option value="RE">RE</option>
<option value="TLE">TLE</option>
<option value="SE">SE</option>
</select>
</div>
<div class="form-row">
<label>开始时间</label>
<input type="text" id="filter-start" placeholder="2026-07-01T00:00:00Z">
</div>
<div class="form-row">
<label>结束时间</label>
<input type="text" id="filter-end" placeholder="2026-07-31T23:59:59Z">
</div>
<button type="submit" class="btn btn-primary">查询</button>
<button type="button" class="btn" onclick="resetFilters()">重置</button>
</form>
</section>
<section class="card">
<div id="empty" class="empty" style="display:none">暂无日志</div>
<table id="logs-table" style="display:none">
<thead>
<tr><th>时间</th><th>提交 ID</th><th>用户名</th><th>测试点</th><th>结果</th><th>得分</th><th>用时</th><th>隐藏</th><th>说明</th></tr>
</thead>
<tbody id="logs-body"></tbody>
</table>
<p id="loading" class="muted">加载中...</p>
<div id="pager" class="muted"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin_logs.js"></script>
<script>
(async function() {
    const user = await requireRole(['teacher', 'admin']);
    if (!user) return;
    await loadLogs(1);
})();
</script>
{% endblock %}
